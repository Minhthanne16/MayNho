services:
  postgres:
    image: postgres:17-alpine
    container_name: maynho-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: maynho_dev
      POSTGRES_USER: maynho_user
      POSTGRES_PASSWORD: maynho_dev_password
    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maynho_user -d maynho_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.23.1
    container_name: maynho-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025" # UI
      - "1025:1025" # SMTP
    environment:
      MP_MAX_MESSAGES: 500

volumes:
  postgres_data:

